# nginx — reverse proxy (mục 1.2 plan): 2 server block.
#   • Agent:  bắt buộc mTLS (verify client cert + CRL) → forward X-SSL-Client-* header
#   • Portal: TLS thường + JWT ở tầng app
events {}

http {
    map $ssl_client_s_dn $ssl_client_cn {
        default "";
        ~CN=([^,/]+) $1;
    }

    server {
        listen 80;
        server_name inventory.local;
        return 301 https://$host$request_uri;
    }

    # ── Block dành cho AGENT (mTLS bắt buộc) ──────────────────
    server {
        listen 9443 ssl;
        server_name agent.inventory.local;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_client_certificate /etc/nginx/certs/issuing-ca.crt;   # CA issuer
        ssl_crl             /etc/nginx/certs/issuing-ca.crl.pem;   # CRL từ step-ca/dev CA
        ssl_verify_client   optional;  # optional → app kiểm tra X-SSL-Client-Verify
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_dhparam         /etc/nginx/certs/dhparam.pem;

        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
            proxy_set_header X-SSL-Client-CN $ssl_client_cn;
        }
    }

    # ── Block dành cho PORTAL (TLS thường) ────────────────────
    server {
        listen 443 ssl;
        server_name inventory.local;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Hardening headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        # PORT=3003 trong compose (dev stack publish 3003) — KHÔNG phải 3000
        location /api/ {
            proxy_pass http://portal:3003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket realtime
        location /api/ws {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # install.ps1 động: irm https://<portal>/i/<token> | iex
        # (route /i/{token} nằm ở API — thiếu location này sẽ 404 như đã gặp ở dev)
        location /i/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Tải agent MSI (đã ký) để install.ps1 tải về
        location /download/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://portal:3003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
