# Docker Compose — môi trường dev/staging cho server
# Chạy: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ca:
    image: smallstep/step-ca:latest
    # Cần khởi tạo CA trước (xem docs step-ca init) — dev mặc định dùng CA local trong app
    profiles: ["full"]
    environment:
      DOCKER_STEPCA_INIT_NAME: "Asset Inventory Internal CA"

  api:
    image: asset-inventory-api:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@postgres:5432/inventory
      REDIS_URL: redis://redis:6381/0
      CA_MODE: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro     # TLS cert server
      # - ./nginx/crl:/etc/nginx/crl:ro          # CRL từ step-ca
    depends_on:
      - api

volumes:
  pgdata:
