# Docker Compose — tầng edge cho portal (dev/staging trên host đã có stack nền).
#
# Stack nền "asset-inventory" (xem .worktrees/docker-dev-stack/docker-compose.yml)
# đang chạy: postgres, redis, api, deepagent trên mạng `asset-inventory_inventory-net`.
# File NÀY chỉ thêm phần giao diện người dùng lên cùng mạng đó:
#   - portal  : Next.js BFF (publish 3003, dev)
#   - certs   : sinh self-signed cert cho nginx (chạy 1 lần)
#   - nginx   : reverse proxy HTTPS duy nhất → portal/api.
#               Đây là entrypoint bắt buộc để ghi X-Forwarded-For/X-Real-IP
#               (IP client thật) cho audit log — KHÔNG truy cập thẳng :3003/:8000.
#
# Chạy: docker compose up -d nginx        (chỉ portal + certs + nginx)
services:
  portal:
    build:
      context: ../../portal
      dockerfile: Dockerfile.dev
    image: asset-inventory-portal:dev
    environment:
      # api = alias container api của stack asset-inventory (cùng mạng external)
      API_BASE: http://api:8000
      COOKIE_SECURE: "false"   # dev: chạy http, không cần Secure cookie
      NODE_ENV: development
      # PORT=3003: Next.js dev mặc định bind 3000 → đặt PORT=3003 để
      # trùng với host port mapping và tránh xung đột với các dịch vụ khác.
      PORT: 3003
      HOSTNAME: "0.0.0.0"
      # Bật polling cho Docker Desktop / WSL2 / ổ mount chậm
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      # Chỉ publish 127.0.0.1 — truy cập thật qua nginx (443); 3003 chỉ để
      # dev/test cục bộ, không expose LAN (tránh bỏ qua lớp ghi IP thật).
      - "127.0.0.1:3003:3003"
    # Mount source (read-write) + named volume cho node_modules/.next
    # (tránh overwrite symlink trên host + cache qua các lần restart).
    # Cần :rw để Next.js dev ghi next-env.d.ts / cache.
    volumes:
      - ../../portal:/app
      - portal_node_modules:/app/node_modules
      - portal_next:/app/.next
    working_dir: /app
    command: pnpm dev

  certs:
    image: alpine:3.20
    volumes:
      - nginx-certs:/certs
      - ./nginx/init-dev-certs.sh:/usr/local/bin/init-dev-certs.sh:ro
    command: ["/bin/sh", "/usr/local/bin/init-dev-certs.sh"]

  nginx:
    image: nginx:1.27-alpine
    # Host 80 đã bị traefik (stack khác) chiếm → map HTTP lên 8080, HTTPS giữ 443.
    # Truy cập portal: https://<host>/ (hoặc http://<host>:8080 → redirect 443).
    ports:
      - "443:443"
      - "8080:80"
      - "9443:9443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-certs:/etc/nginx/certs:ro
    depends_on:
      portal:
        condition: service_started
      certs:
        condition: service_completed_successfully

volumes:
  nginx-certs:
  portal_node_modules:
  portal_next:

networks:
  default:
    # Mạng dùng chung với postgres/redis/deepagent/api đang chạy (project
    # "asset-inventory" từ .worktrees/docker-dev-stack/docker-compose.yml).
    # Khai báo external để không bị Compose phàn nàn về label khác project.
    external: true
    name: asset-inventory_inventory-net
