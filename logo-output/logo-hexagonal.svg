<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer hexagon - main shape -->
  <g transform="translate(256,256)">
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90"
             fill="#1E3A8A"
             stroke="#0F172A"
             stroke-width="4"
             stroke-linejoin="round"/>

    <!-- Inner hexagon outline -->
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55"
             fill="none"
             stroke="#3B82F6"
             stroke-width="6"
             stroke-linejoin="round"/>

    <!-- Central hexagon (filled) - core CPU/resource -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"
             fill="#60A5FA"
             stroke="#FFFFFF"
             stroke-width="3"/>

    <!-- Resource nodes around center -->
    <circle cx="0" cy="-30" r="6" fill="#FFFFFF"/>
    <circle cx="26" cy="0" r="6" fill="#FFFFFF"/>
    <circle cx="-26" cy="0" r="6" fill="#FFFFFF"/>
    <circle cx="0" cy="30" r="6" fill="#FFFFFF"/>
    <circle cx="15" cy="-15" r="5" fill="#FFFFFF"/>
    <circle cx="-15" cy="15" r="5" fill="#FFFFFF"/>
    <circle cx="15" cy="15" r="5" fill="#FFFFFF"/>
    <circle cx="-15" cy="-15" r="5" fill="#FFFFFF"/>

    <!-- Connection lines -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="26" y2="0" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="-26" y2="0" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="30" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
