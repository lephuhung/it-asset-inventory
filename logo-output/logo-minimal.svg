<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimal Q monogram - perfect for small favicons -->
  <g transform="translate(256,256)">
    <!-- Background rounded square -->
    <rect x="-220" y="-220" width="440" height="440" rx="90" fill="#1E3A8A"/>

    <!-- Q letter formed by hexagon + tail -->
    <!-- Outer hexagon -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"
             fill="none"
             stroke="#FFFFFF"
             stroke-width="22"
             stroke-linejoin="round"/>

    <!-- Tail of Q (diagonal line bottom-right) -->
    <line x1="40" y1="40" x2="120" y2="120" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

    <!-- Inner accent dot -->
    <circle cx="0" cy="0" r="20" fill="#60A5FA"/>
  </g>
</svg>
