<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Isometric cube representing 3D resource management -->
  <g transform="translate(256,256)">
    <!-- Top face -->
    <polygon points="0,-140 121,-70 0,0 -121,-70"
             fill="#93C5FD"
             stroke="#0F172A"
             stroke-width="3"
             stroke-linejoin="round"/>

    <!-- Left face (darker) -->
    <polygon points="-121,-70 0,0 0,140 -121,70"
             fill="#1E3A8A"
             stroke="#0F172A"
             stroke-width="3"
             stroke-linejoin="round"/>

    <!-- Right face (medium) -->
    <polygon points="121,-70 0,0 0,140 121,70"
             fill="#3B82F6"
             stroke="#0F172A"
             stroke-width="3"
             stroke-linejoin="round"/>

    <!-- Server lines on left face -->
    <line x1="-95" y1="-50" x2="-26" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="-95" y1="-20" x2="-26" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="-95" y1="10" x2="-26" y2="80" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>

    <!-- Server lines on right face -->
    <line x1="26" y1="20" x2="95" y2="-50" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="26" y1="50" x2="95" y2="-20" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="26" y1="80" x2="95" y2="10" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>

    <!-- Top face inner border -->
    <polygon points="0,-110 95,-55 0,0 -95,-55"
             fill="none"
             stroke="#FFFFFF"
             stroke-width="2"
             opacity="0.5"/>

    <!-- Center dot on top -->
    <circle cx="0" cy="-55" r="8" fill="#FFFFFF"/>
  </g>
</svg>
