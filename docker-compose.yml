# ════════════════════════════════════════════════════════════════
# Master dev stack — postgres + redis + api + portal
# ════════════════════════════════════════════════════════════════
# Start:  docker compose up --build
# Stop:   docker compose down            (giữ volume, DB còn)
# Reset:  docker compose down -v         (XOÁ volume — mất DB + redis cache)
# Logs:   docker compose logs -f api portal
# Shell:  docker compose exec api bash
#         docker compose exec portal sh
# ════════════════════════════════════════════════════════════════
name: asset-inventory

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [inventory-net]

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [inventory-net]

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DEEPAGENT_MAX_CONCURRENT_JOBS: ${DEEPAGENT_MAX_CONCURRENT_JOBS:-12}
      # override để dùng docker DNS thay vì localhost
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-inventory}@postgres:5432/${POSTGRES_DB:-inventory}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./server:/app:ro
      - ./server/agent_dist:/data/artifacts:ro
    working_dir: /app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [inventory-net]

  deepagent:
    build:
      context: ./deepagent
      dockerfile: Dockerfile
    image: asset-inventory-deepagent:latest
    env_file: .env
    environment:
      # .env dùng DEEPAGENT_API_KEY làm service token phía backend; container
      # deepagent cần cùng giá trị dưới tên DEEPAGENT_SERVICE_TOKEN.
      DEEPAGENT_SERVICE_TOKEN: ${DEEPAGENT_API_KEY:?DEEPAGENT_API_KEY must be set}
      DEEPAGENT_BACKEND_URL: http://api:8000
      DEEPAGENT_BACKEND_API_KEY: ${DEEPAGENT_BACKEND_API_KEY:?DEEPAGENT_BACKEND_API_KEY must be set}
      DEEPAGENT_MAX_CONCURRENT_JOBS: ${DEEPAGENT_MAX_CONCURRENT_JOBS:-12}
      DEEPAGENT_MCP_COMMAND: /opt/mcp-venv/bin/python
      DEEPAGENT_MCP_ARGS_JSON: '["/opt/mcp-velociraptor/mcp_velociraptor_bridge.py"]'
      DEEPAGENT_MCP_ENV_JSON: '{"ENABLE_DANGEROUS_TOOLS":"false","VELOCIRAPTOR_DEFAULT_LIMIT":"100","VELOCIRAPTOR_MAX_LIMIT":"1000"}'
      DEEPAGENT_MCP_TOOL_TIMEOUT_SECONDS: ${DEEPAGENT_MCP_TOOL_TIMEOUT_SECONDS:-180}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [inventory-net]

  chatagent:
    build:
      context: ./chatagent
      dockerfile: Dockerfile
      args:
        # Pin mcp-velociraptor to the same immutable SHA as deepagent (spec §"Triển khai").
        MCP_VELOCIRAPTOR_REF: ${MCP_VELOCIRAPTOR_REF:-9b3c4b3a590029390e88049896a473d7f909c0ce}
    image: asset-inventory-chatagent:latest
    # F5: chatagent nhận CHỈ biến CHATAGENT_* tường minh — KHÔNG `env_file: .env`
    # (root .env chứa DATABASE_URL, SECRET_KEY, DATA_ENCRYPTION_KEY). Không có
    # `ports:` — agent không publish port, chỉ reachable trên inventory-net.
    environment:
      # Trùng backend `CHAT_SERVICE_TOKEN` (T10) — agent gửi qua `X-Service-Token`.
      CHATAGENT_SERVICE_TOKEN: ${CHAT_SERVICE_TOKEN:?CHAT_SERVICE_TOKEN must be set}
      CHATAGENT_BACKEND_URL: http://api:8000
      CHATAGENT_BACKEND_API_KEY: ${CHATAGENT_BACKEND_API_KEY:-}
      CHATAGENT_MAX_TOOL_CALLS: ${CHATAGENT_MAX_TOOL_CALLS:-12}
      CHATAGENT_MAX_EVIDENCE_CHARS: ${CHATAGENT_MAX_EVIDENCE_CHARS:-120000}
      CHATAGENT_WALL_CLOCK_SECONDS: ${CHATAGENT_WALL_CLOCK_SECONDS:-300}
      CHATAGENT_EGRESS_ALLOW_CLOUD: ${CHATAGENT_EGRESS_ALLOW_CLOUD:-false}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [inventory-net]

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile.dev
    environment:
      API_BASE: http://api:8000
      PORT: 3003
      HOSTNAME: "0.0.0.0"
    ports:
      - "${PORTAL_PORT:-3003}:3003"
    volumes:
      - ./portal:/app
      - portal_node_modules:/app/node_modules
      - portal_next:/app/.next
    working_dir: /app
    # Dev server — HMR tự reload khi sửa code, không cần rebuild.
    # Trước đây dùng production standalone (build trước → chạy server.js),
    # nhưng mỗi lần sửa code phải xóa BUILD_ID + restart container mới thấy.
    # app/global-error.tsx đã có sẵn (không dùng AuthContext) nên dev mode
    # không còn fail ở /_global-error như comment cũ.
    command: pnpm dev
    depends_on:
      - api
    networks: [inventory-net]

volumes:
  pgdata:
  redisdata:
  portal_node_modules:
  portal_next:

networks:
  inventory-net:
    driver: bridge
