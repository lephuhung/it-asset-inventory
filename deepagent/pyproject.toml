[project]
name = "deepagent-dfir"
version = "0.1.0"
description = "LangGraph orchestrator for bounded Velociraptor DFIR investigations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-mcp-adapters>=0.2,<1",
    "langchain-openai>=0.3,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepagent"]
